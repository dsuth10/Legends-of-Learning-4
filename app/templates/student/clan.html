{% extends "student/base_student.html" %}

{% block title %}Clan{% endblock %}

{% block shell_main %}
<div class="h-full overflow-y-auto p-6" id="clan-container">
    <h2 class="font-display text-2xl font-bold text-gray-800 dark:text-white mb-4">Your Clan</h2>
    <div id="clan-content">
        <div class="rounded-xl border border-blue-200 bg-blue-50 dark:bg-blue-900/20 dark:border-blue-800 p-4 text-sm">Loading clan info...</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.addEventListener('DOMContentLoaded', function() {
    fetch('/student/api/clan')
        .then(res => res.json())
        .then(data => {
            const clan = data.clan;
            const content = document.getElementById('clan-content');
            if (!clan) {
                content.innerHTML = '<div class="rounded-xl border border-amber-200 bg-amber-50 dark:bg-amber-900/20 dark:border-amber-800 p-4 text-sm">You are not in a clan.</div>';
                return;
            }
            let bannerHtml = '';
            if (clan.banner) {
                bannerHtml = `<img src='${clan.banner}' alt='Clan Banner' class='w-full max-h-20 object-contain mb-2'>`;
            }
            let emblemHtml = '';
            if (clan.emblem) {
                emblemHtml = `<img src='${clan.emblem}' alt='Clan Emblem' class='h-14 mb-3'>`;
            }
            let themeStyle = clan.theme_color ? ` style='border: 2px solid ${clan.theme_color};'` : '';
            let membersHtml = '';
            if (clan.members && clan.members.length > 0) {
                membersHtml = `<ul class='space-y-2 mb-3'>` +
                    clan.members.map(m => `
                        <li class='flex items-center rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-2'>
                            <img src='${m.avatar_url || '/static/avatars/default.svg'}' class='rounded mr-2 w-8 h-8' width='32' height='32' alt='avatar'>
                            <span>${m.name} <span class='ml-2 text-xs rounded bg-gray-200 dark:bg-gray-700 px-2 py-0.5'>${m.character_class}</span></span>
                            ${m.is_active ? '<span class="ml-auto text-xs rounded bg-green-600 text-white px-2 py-0.5">Active</span>' : ''}
                        </li>
                    `).join('') + '</ul>';
            } else {
                membersHtml = '<div class="rounded-xl border border-gray-200 dark:border-gray-700 p-4 text-sm text-gray-500">No members found.</div>';
            }
            let metricsHtml = '';
            if (clan.metrics) {
                metricsHtml = `
                <div class='mb-3'>
                    <strong>Clan Progress</strong>
                    <div class='h-6 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden mb-2'>
                        <div class='h-full bg-primary text-white text-xs flex items-center px-2' style='width: ${Math.round((clan.metrics.avg_completion_rate || 0) * 100)}%;'>
                            ${Math.round((clan.metrics.avg_completion_rate || 0) * 100)}%
                        </div>
                    </div>
                    <div class='grid grid-cols-1 sm:grid-cols-3 gap-2 text-sm'>
                        <div><strong>Total Points:</strong> ${clan.metrics.total_points ?? 0}</div>
                        <div><strong>Active Members:</strong> ${clan.metrics.active_members ?? 0}</div>
                        <div><strong>Avg Member Level:</strong> ${clan.metrics.avg_member_level ?? '-'}</div>
                    </div>
                </div>
                `;
            }
            let badgesHtml = '';
            if (clan.badges && clan.badges.length > 0) {
                badgesHtml = `<div class='mb-2'><strong>Clan Badges:</strong></div><div class='flex flex-wrap gap-2'>` +
                  clan.badges.map(b => `
                    <img src='${b.icon}' title='${b.name}: ${b.description}' alt='${b.name}' class='w-10 h-10'>
                  `).join('') + '</div>';
            }
            content.innerHTML = `
                <div class='rounded-xl bg-white dark:bg-gray-800 shadow p-4 mb-3'${themeStyle}>
                    ${bannerHtml}
                    ${emblemHtml}
                    <h3 class='font-display text-xl font-bold'>${clan.name}</h3>
                </div>
                ${badgesHtml}
                ${membersHtml}
                ${metricsHtml}
            `;
        })
        .catch(() => {
            document.getElementById('clan-content').innerHTML = '<div class="rounded-xl border border-red-200 bg-red-50 dark:bg-red-900/20 dark:border-red-800 p-4 text-sm">Failed to load clan info.</div>';
        });
});
</script>
{% endblock %}
