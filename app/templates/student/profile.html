{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Profile for {{ student.get_display_name() }}</h2>
        <a href="{{ url_for('auth.logout') }}" 
           class="btn btn-outline-secondary btn-sm"
           title="Logout"
           aria-label="Logout">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>
    <p class="text-muted">Update how your name appears in the game. Username and email are managed by your teacher.</p>
    <form method="post" class="mt-4" style="max-width: 32rem;">
        <div class="mb-3">
            <label for="display_name" class="form-label">Display name</label>
            <input type="text" class="form-control" id="display_name" name="display_name"
                   value="{{ student.display_name or '' }}" maxlength="64" placeholder="How you want to be called">
        </div>
        <div class="mb-3">
            <label for="first_name" class="form-label">First name</label>
            <input type="text" class="form-control" id="first_name" name="first_name"
                   value="{{ student.first_name or '' }}" maxlength="64">
        </div>
        <div class="mb-3">
            <label for="last_name" class="form-label">Last name</label>
            <input type="text" class="form-control" id="last_name" name="last_name"
                   value="{{ student.last_name or '' }}" maxlength="64">
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
{% endblock %}
