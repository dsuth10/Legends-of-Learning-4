{% extends "student/base_student.html" %}

{% block title %}Profile{% endblock %}

{% block shell_main %}
<div class="h-full overflow-y-auto p-6">
    <h2 class="font-display text-2xl font-bold text-gray-800 dark:text-white mb-2">Profile for {{ student.get_display_name() }}</h2>
    <p class="text-gray-500 mb-6">Update how your name appears in the game. Username and email are managed by your teacher.</p>
    <form method="post" class="max-w-lg space-y-4">
        <div>
            <label for="display_name" class="block text-sm font-semibold mb-1">Display name</label>
            <input type="text" class="w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800" id="display_name" name="display_name"
                   value="{{ student.display_name or '' }}" maxlength="64" placeholder="How you want to be called">
        </div>
        <div>
            <label for="first_name" class="block text-sm font-semibold mb-1">First name</label>
            <input type="text" class="w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800" id="first_name" name="first_name"
                   value="{{ student.first_name or '' }}" maxlength="64">
        </div>
        <div>
            <label for="last_name" class="block text-sm font-semibold mb-1">Last name</label>
            <input type="text" class="w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800" id="last_name" name="last_name"
                   value="{{ student.last_name or '' }}" maxlength="64">
        </div>
        <button type="submit" class="rounded-full bg-primary text-white font-bold px-5 py-2 shadow">Save</button>
    </form>
</div>
{% endblock %}
